name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and validation tools
        run: python -m pip install -e ".[dev]"

      - name: Validate tag and source versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from packaging.version import Version
          from moyu_harmony_pilot import __version__

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project["version"]
          parsed = Version(version)
          if str(parsed) != version:
              raise SystemExit("Release version must use canonical PEP 440 spelling.")
          if __version__ != version:
              raise SystemExit("Package __version__ and pyproject.toml version disagree.")
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag must exactly match v{version}.")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"prerelease={str(parsed.is_prerelease).lower()}\n")
          PY

      - name: Build wheel from sdist and check metadata
        env:
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m build --no-isolation
          python -m twine check --strict dist/*

      - name: Validate artifacts and generate SHA-256 checksums
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import email
          import hashlib
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          directory = Path("dist")
          wheels = list(directory.glob("*.whl"))
          sdists = list(directory.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("Expected exactly one wheel and one sdist.")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_paths = [
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit("Wheel must contain exactly one METADATA file.")
              wheel_metadata = email.message_from_bytes(archive.read(metadata_paths[0]))
              archive.getinfo("moyu_harmony_pilot/py.typed")
          with tarfile.open(sdists[0]) as archive:
              metadata_paths = [
                  name for name in archive.getnames()
                  if name.count("/") == 1 and name.endswith("/PKG-INFO")
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit("Sdist must contain exactly one root PKG-INFO file.")
              metadata_file = archive.extractfile(metadata_paths[0])
              if metadata_file is None:
                  raise SystemExit("Sdist metadata is not a regular file.")
              sdist_metadata = email.message_from_bytes(metadata_file.read())
              prefix = metadata_paths[0].rsplit("/", 1)[0]
              archive.getmember(f"{prefix}/src/moyu_harmony_pilot/py.typed")
          for metadata in (wheel_metadata, sdist_metadata):
              if metadata["Name"] != "moyu-harmony-pilot" or metadata["Version"] != version:
                  raise SystemExit("Built distribution name/version disagrees with the tag.")
          paths = sorted(wheels + sdists)
          checksums = []
          for path in paths:
              with path.open("rb") as artifact:
                  digest = hashlib.file_digest(artifact, "sha256").hexdigest()
              checksums.append(f"{digest}  {path.name}\n")
          (directory / "SHA256SUMS").write_text("".join(checksums), encoding="utf-8")
          PY

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --strict --check SHA256SUMS

      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: release-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist

      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum --strict --check SHA256SUMS

      - name: Create or resume draft release
        id: release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            draft=$(jq -r '.isDraft' release.json)
            if [[ "$draft" == "true" ]]; then
              gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
            fi
          else
            gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes \
              --prerelease="$PRERELEASE"
            draft=true
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - name: Verify uploaded release assets
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          python - <<'PY'
          import json
          from pathlib import Path

          expected = sorted(path.name for path in Path("dist").iterdir())
          release = json.loads(Path("release-assets.json").read_text(encoding="utf-8"))
          actual = sorted(asset["name"] for asset in release["assets"])
          if actual != expected:
              raise SystemExit("Release assets must exactly match this build's file list.")
          PY
          gh release download "$RELEASE_TAG" --dir downloaded \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          cmp dist/SHA256SUMS downloaded/SHA256SUMS
          cd downloaded
          sha256sum --strict --check SHA256SUMS

      - name: Publish verified draft
        if: steps.release.outputs.draft == 'true'
        run: >-
          gh release edit "$RELEASE_TAG" --draft=false
          --prerelease="$PRERELEASE" --verify-tag
