[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moyu-harmony-pilot"
version = "0.2.1"
description = "Production-grade, non-intrusive HarmonyOS NEXT (5/6+) Python automation engine and secure pull-based task bridge."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MoyuFamily" }]
keywords = ["harmonyos", "harmonyos-next", "hdc", "uitest", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
vision = ["pillow>=10.1"]
vision-macos = [
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]
vision-rapidocr = [
    "rapidocr-onnxruntime>=1.4.0",
]
dev = [
    "build>=1.2",
    "setuptools>=77.0",
    "pytest>=8.0",
    "ruff>=0.8.0",
    "mypy>=1.11",
    "packaging>=24.2",
    "twine>=6.1",
    "types-PyYAML>=6.0",
    "pillow>=10.1",
    "mcp>=2,<3",
]

[project.scripts]
harmony-pilot = "moyu_harmony_pilot.cli.main:main"
harmony-pilot-mcp = "moyu_harmony_pilot.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
moyu_harmony_pilot = ["py.typed"]

[tool.setuptools.data-files]
"share/moyu-harmony-pilot/skills/harmony-pilot" = ["skills/harmony-pilot/SKILL.md"]
"share/moyu-harmony-pilot/plugin-template" = [
    "examples/plugin-template/.gitignore",
    "examples/plugin-template/LICENSE",
    "examples/plugin-template/MANIFEST.in",
    "examples/plugin-template/README.md",
    "examples/plugin-template/pyproject.toml",
    "examples/plugin-template/requirements-test.txt",
]
"share/moyu-harmony-pilot/plugin-template/.github/workflows" = [
    "examples/plugin-template/.github/workflows/contract.yml",
]
"share/moyu-harmony-pilot/plugin-template/src/harmony_pilot_example" = [
    "examples/plugin-template/src/harmony_pilot_example/__init__.py",
    "examples/plugin-template/src/harmony_pilot_example/battery.py",
    "examples/plugin-template/src/harmony_pilot_example/toggle.py",
]
"share/moyu-harmony-pilot/plugin-template/tests" = [
    "examples/plugin-template/tests/__init__.py",
    "examples/plugin-template/tests/__main__.py",
    "examples/plugin-template/tests/support.py",
    "examples/plugin-template/tests/test_contract.py",
    "examples/plugin-template/tests/test_mutating_contract.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
warn_unreachable = true
disallow_any_unimported = true
extra_checks = true
show_error_codes = true

# Optional external backends may ship without stubs or be absent on the host OS.
# These exact import targets leave every moyu_harmony_pilot module under strict checks.
[[tool.mypy.overrides]]
module = ["Foundation", "Quartz", "Vision", "objc", "rapidocr_onnxruntime", "yaml"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
