name: Plugin contract

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check out the Pilot test baseline
        uses: actions/checkout@v4
        with:
          repository: MoyuFamily/moyu-harmony-pilot
          ref: ${{ vars.PILOT_REF || 'v0.2.1' }}
          path: .pilot-sdk
      - name: Install Pilot and both plugin entry points
        run: |
          git -C .pilot-sdk rev-parse HEAD
          python -m pip install ./.pilot-sdk
          python -m pip install --no-index --no-deps -r requirements-test.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Run required offline contracts
        run: python -m tests
      - name: Verify installed capability discovery and validation
        run: |
          harmony-pilot plugins describe example.battery_check --json
          harmony-pilot plugins describe example.demo_toggle --json
          harmony-pilot plugins validate example.battery_check --params-json '{"minimum_battery":20}' --json
          harmony-pilot plugins validate example.demo_toggle --params-json '{"enabled":true}' --idempotency-key synthetic-ci --json
