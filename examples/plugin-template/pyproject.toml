[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-pilot-example"
version = "0.1.0"
description = "Example external battery-check action for Harmony Pilot."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["moyu-harmony-pilot>=0.1.0.dev1,<0.2"]

[project.entry-points."moyu_harmony_pilot.actions"]
"example.battery_check" = "harmony_pilot_example.battery:BatteryCheck"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
